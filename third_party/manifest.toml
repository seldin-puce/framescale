# Pinned third-party artifacts. `cargo xtask` downloads ONLY what is listed
# here, and it refuses any download whose SHA-256 differs.
#
# Entries with sha256 = "" are unpinned. `cargo xtask pin` downloads them
# once, prints the digest, and writes it here (trust-on-first-pin; review the
# diff). Before the first release, mirror every artifact into our own
# release bucket and set `mirror`: upstream autobuilds (BtbN) are pruned
# after some weeks.

# ------------------------------------------------------------------------------
# FFmpeg 8.1.3, GPL builds. FrameScale is GPL-3.0-or-later (decision D9),
# so we ship FFmpeg's GPL configuration: libx265 (software HEVC 10-bit with
# HDR10 metadata in the bitstream) and libx264. Runs as a sidecar process.
# GPL: each release must provide the corresponding source; see
# docs/build-and-release.md ("GPL source obligations").
# ------------------------------------------------------------------------------
[ffmpeg]
version = "8.1.3"
license = "GPL-3.0-or-later"

# Run against every bundled build by `cargo xtask sidecars`; bundling fails if any check fails.
[ffmpeg.gate]
# --enable-nonfree builds are not redistributable at all.
forbidden_configure_flags = ["--enable-nonfree"]
required_filters = ["zscale", "scdet", "vfrdet", "idet", "bwdif", "fps", "format"]
required_encoders_common = ["libsvtav1", "libx265", "ffv1"]
required_decoders_common = ["libdav1d", "hevc", "h264", "prores", "vp9"]

[ffmpeg.gate.encoders]
"x86_64-unknown-linux-gnu" = ["libx264", "hevc_nvenc", "av1_nvenc", "hevc_vaapi", "av1_vaapi", "hevc_qsv", "av1_qsv"]
"x86_64-pc-windows-msvc"   = ["libx264", "hevc_nvenc", "av1_nvenc", "hevc_amf", "av1_amf", "hevc_qsv", "av1_qsv"]
"aarch64-apple-darwin"     = ["hevc_videotoolbox", "prores_videotoolbox"]
"x86_64-apple-darwin"      = ["hevc_videotoolbox", "prores_videotoolbox"]

[ffmpeg.targets."x86_64-unknown-linux-gnu"]
url    = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-02-12-51/ffmpeg-n8.1.3-32-g760d10603e-linux64-gpl-8.1.tar.xz"
sha256 = "75cd1928804590b22209952f6f4eca3a68a36bc671cffa0d81426df1f6623881"
mirror = ""

[ffmpeg.targets."x86_64-pc-windows-msvc"]
url    = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-02-12-51/ffmpeg-n8.1.3-32-g760d10603e-win64-gpl-8.1.zip"
sha256 = "29da2b3b4f1db458df12abc04b6297be11335547fa3f39646419b9d5293dd72a"
mirror = ""

# macOS: no trustworthy prebuilt exists, so we build from source with
# third_party/ffmpeg/build-macos.sh (pinned versions below). xtask picks up
# third_party/ffmpeg/out/<target>/bin/{ffmpeg,ffprobe}.
[ffmpeg.source]
url    = "https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
sha256 = "7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"

[ffmpeg.source.deps]
# x265 (GPL-2.0+) built 10-bit for HEVC Main10 + HDR10; the rest BSD/ISC/WTFPL.
svt_av1 = { url = "https://gitlab.com/AOMediaCodec/SVT-AV1/-/archive/v4.3.0/SVT-AV1-v4.3.0.tar.gz", sha256 = "95ce8fc2381ba707e65ac8b9b2e165915bfbe9cd4d2f7b0f58d64ce31bd98f6d" }
dav1d   = { url = "https://code.videolan.org/videolan/dav1d/-/archive/1.5.4/dav1d-1.5.4.tar.gz",       sha256 = "a1d5b63d2d38ec9bd03acf643caa51fa22edd1e89c5a109c4807717216bbec07" }
zimg    = { url = "https://github.com/sekrit-twc/zimg/archive/refs/tags/release-3.0.6.tar.gz",         sha256 = "be89390f13a5c9b2388ce0f44a5e89364a20c1c57ce46d382b1fcc3967057577" }
x265    = { url = "https://download.videolan.org/videolan/x265/x265_4.2.tar.gz",                         sha256 = "40b1ea0453e0309f0eba934e0ddf533f8f6295966679e8894e8f1c1c8d5e1210" }

