# Real-ESRGAN General v3 (xinntao, BSD-3-Clause): the fast live-action ×4
# SRVGGNetCompact and its weak-denoise twin. There's no official ncnn release,
# so `convert = "srvgg"` turns the official .pth into ncnn at build time (the
# pickle is interpreted, never executed; xtask/src/pth.rs). The engine blends
# the two by the Upscale stage's denoise strength, like Real-ESRGAN's
# `--denoise_strength`.
[[models]]
id      = "realesr-general-x4v3"
license = "BSD-3-Clause"
url     = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth"
sha256  = "8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292"
convert = "srvgg"
file    = "realesr-general-x4v3"
dest    = "realesrgan/models"

