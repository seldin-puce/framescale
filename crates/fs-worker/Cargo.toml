[package]
name = "fs-worker"
description = "FrameScale render worker: decode pipe → GPU stages → segmented encode pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fs-worker"
path = "src/main.rs"

[features]
default = ["backend-ncnn"]
# Real inference through ncnn (Vulkan, or ncnn's CPU path). Without any
# backend the worker falls back to the CPU reference backend and warns.
backend-ncnn = ["ncnn", "fs-engine/backend-ncnn"]
ncnn = ["fs-engine/ncnn"]
# Not implemented yet (docs/engine-audit.md): selection and the TensorRT
# runtime probe are built, opening either backend stops with
# `unimplemented!`.
backend-tensorrt = ["fs-engine/backend-tensorrt", "dep:libloading"]
backend-apple = ["fs-engine/backend-apple"]

[dependencies]
fs-types          = { workspace = true }
fs-engine         = { workspace = true }
fs-media          = { workspace = true }
fs-proc           = { workspace = true }
fs-hw             = { workspace = true }
serde_json        = { workspace = true }
crossbeam-channel = { workspace = true }
libloading        = { workspace = true, optional = true }

[dev-dependencies]
fs-media = { workspace = true }

[lints]
workspace = true
