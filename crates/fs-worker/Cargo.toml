[package]
name = "fs-worker"
description = "FrameScale render worker: decode pipe → GPU stages → segmented encode pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fs-worker"
path = "src/main.rs"

[features]
default = ["ncnn"]
# Real inference. Without it the worker falls back to the CPU reference backend.
ncnn = ["fs-engine/ncnn"]

[dependencies]
fs-types          = { workspace = true }
fs-engine         = { workspace = true }
fs-media          = { workspace = true }
fs-proc           = { workspace = true }
fs-license        = { workspace = true }
fs-hw             = { workspace = true }
serde_json        = { workspace = true }
crossbeam-channel = { workspace = true }

[dev-dependencies]
fs-media = { workspace = true }

[lints]
workspace = true
