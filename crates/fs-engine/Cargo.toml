[package]
name = "fs-engine"
description = "Inference engine: InferenceBackend trait, tile backoff, interpolation scheduling, backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
links = "fs_ncnn"

[features]
# Vulkan/CPU inference via ncnn (built from the pinned source: `cargo xtask ncnn`).
ncnn = ["dep:cxx", "dep:cxx-build", "dep:cmake"]
# Backend names used across the workspace. `backend-ncnn` is `ncnn`.
backend-ncnn = ["ncnn"]
# Not implemented yet (docs/engine-audit.md): reserved so selection can
# already be built and tested.
backend-tensorrt = []
# Core ML on Apple Silicon (crates/fs-engine/src/apple.rs). The bindings are
# macOS-only dependencies, so the feature is a no-op elsewhere.
backend-apple = [
    "dep:block2",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-core-ml",
    "dep:objc2-core-video",
    "dep:objc2-foundation",
    "dep:objc2-metal",
]

[dependencies]
tracing = { workspace = true }
fs-types    = { workspace = true }
thiserror   = { workspace = true }
xxhash-rust = { workspace = true }
cxx         = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2                = { workspace = true, optional = true }
objc2                 = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }
objc2-core-ml         = { workspace = true, optional = true }
objc2-core-video      = { workspace = true, optional = true }
objc2-foundation      = { workspace = true, optional = true }
objc2-metal           = { workspace = true, optional = true }

[build-dependencies]
cxx-build = { workspace = true, optional = true }
cmake     = { workspace = true, optional = true }

[lints]
workspace = true

[[example]]
name = "bench"
required-features = ["ncnn"]

[[example]]
name = "enhance_image"
required-features = ["ncnn"]

[[example]]
name = "coreml_compare"
required-features = ["ncnn", "backend-apple"]
