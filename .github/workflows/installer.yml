name: macOS installer

on:
  workflow_dispatch:
  push:
    paths:
      - site/install.sh
      - .github/workflows/installer.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: Ways to attach a DMG with a license agreement
        run: |
          set +e
          URL=$(curl -fsSL https://api.github.com/repos/seldin-puce/framescale/releases/latest | grep -o '"browser_download_url": *"[^"]*_aarch64\.dmg"' | head -n1 | sed 's/.*"\(https[^"]*\)"/\1/')
          curl -fsSL -o fs.dmg "$URL"; ls -la fs.dmg
          echo "== imageinfo (SLA?)"; hdiutil imageinfo fs.dmg 2>&1 | grep -i -E "licen|sla|Format:" | head
          try() { name=$1; shift; mkdir -p "m-$name"; echo "== $name"; "$@" ; rc=$?; echo "rc=$rc"; ls "m-$name" 2>&1 | head -3; hdiutil detach -quiet "m-$name" 2>/dev/null; }
          try plain sh -c 'hdiutil attach -nobrowse -readonly -mountpoint m-plain fs.dmg </dev/null 2>&1 | tail -5'
          try qy sh -c "printf 'qy\n' | hdiutil attach -nobrowse -readonly -mountpoint m-qy fs.dmg 2>&1 | tail -5"
          try yes_pager sh -c 'yes | PAGER=true hdiutil attach -nobrowse -readonly -mountpoint m-yes_pager fs.dmg 2>&1 | tail -5'
          try y_pager sh -c "printf 'Y\n' | PAGER=true hdiutil attach -nobrowse -readonly -mountpoint m-y_pager fs.dmg 2>&1 | tail -5"
          try convert sh -c 'hdiutil convert -quiet fs.dmg -format UDTO -o fs-plain && hdiutil attach -nobrowse -readonly -noautoopen -mountpoint m-convert fs-plain.cdr </dev/null 2>&1 | tail -5'
