name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 12.16.1

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm ui:build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: macos-15,     target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install   # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # tauri-build checks that sidecars and frameworks exist. Lint jobs use stubs.
      - run: cargo xtask sidecars --stub --target ${{ matrix.target }}
      # The frontend dist must exist for tauri::generate_context!().
      - run: mkdir -p apps/desktop/dist && echo '<!doctype html>' > apps/desktop/dist/index.html
        shell: bash
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  ipc-types-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gen-types
      - name: Generated TS bindings must be committed
        run: git diff --exit-code packages/ipc-types/src/generated

  ffmpeg-gate:
    name: ffmpeg gate + integration
    # Verifies the pinned FFmpeg builds stay LGPL and keep every filter/encoder
    # the pipeline needs. Runs on the hosts that can execute them.
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: downloads-${{ hashFiles('third_party/manifest.toml') }}
      - run: cargo xtask sidecars --target ${{ matrix.target }}
      # Integration tests against the real pinned FFmpeg + fs-worker binary:
      # probe/analyze/seek exactness, HDR passthrough, bit-exact resume, full job.
      - name: Integration tests
        shell: bash
        run: |
          EXE=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cargo build -p fs-worker
          export FS_FFMPEG="$PWD/apps/desktop/src-tauri/binaries/ffmpeg-${{ matrix.target }}$EXE"
          export FS_FFPROBE="$PWD/apps/desktop/src-tauri/binaries/ffprobe-${{ matrix.target }}$EXE"
          export FS_WORKER="$PWD/target/debug/fs-worker$EXE"
          cargo test -p fs-media -p fs-worker -p fs-core
