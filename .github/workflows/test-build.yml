name: Test build

# Manual, untagged installers for testing (no release, no signing, no updater).
#   gh workflow run test-build.yml -f platform=windows
#   gh run download <run-id> -n framescale-windows
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which installers to build
        type: choice
        options: [windows, macos, linux, all]
        default: windows

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 12.16.1

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          inputs.platform == 'windows' && '[{"name":"windows","os":"windows-2025","target":"x86_64-pc-windows-msvc"}]' ||
          inputs.platform == 'macos' && '[{"name":"macos-arm64","os":"macos-15","target":"aarch64-apple-darwin"},{"name":"macos-x64","os":"macos-15","target":"x86_64-apple-darwin"}]' ||
          inputs.platform == 'linux' && '[{"name":"linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]' ||
          '[{"name":"windows","os":"windows-2025","target":"x86_64-pc-windows-msvc"},{"name":"macos-arm64","os":"macos-15","target":"aarch64-apple-darwin"},{"name":"macos-x64","os":"macos-15","target":"x86_64-apple-darwin"},{"name":"linux","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Rust toolchain + target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with: { key: "test-${{ matrix.target }}" }

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: macOS FFmpeg build deps
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm autoconf automake libtool pkg-config

      - uses: actions/cache@v6
        with:
          path: |
            .cache/downloads
            third_party/ffmpeg/out
          key: thirdparty-${{ matrix.target }}-${{ hashFiles('third_party/manifest.toml', 'third_party/ffmpeg/build-macos.sh') }}

      - name: Sidecars + models (verified, gated)
        run: cargo xtask setup --target ${{ matrix.target }}

      - name: Build installer (unsigned)
        shell: bash
        working-directory: apps/desktop
        run: |
          cfg='{"bundle":{"createUpdaterArtifacts":false}}'
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Ad-hoc signature: Apple Silicon refuses unsigned code.
            cfg='{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}'
          fi
          pnpm tauri build --target ${{ matrix.target }} --config "$cfg"

      - uses: actions/upload-artifact@v4
        with:
          name: framescale-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
