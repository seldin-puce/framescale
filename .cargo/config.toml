[alias]
xtask = "run --quiet --package xtask --"

[env]
# Oldest macOS we support (VideoToolbox ProRes encode + MoltenVK 1.4 baseline).
MACOSX_DEPLOYMENT_TARGET = "12.0"
# ts-rs writes generated IPC bindings straight into the shared TS package.
TS_RS_EXPORT_DIR = { value = "packages/ipc-types/src/generated", relative = true }

# Statically link the MSVC runtime: no VC++ redistributable required for the
# app or for the fs-worker sidecar.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# ncnn's simplevk declares vkGetInstanceProcAddr as a weak import on Apple: a
# last-resort fallback for a statically linked MoltenVK, which we don't use
# (MoltenVK is dlopen'd). Let it stay undefined (null at runtime) instead of
# failing every macOS link.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-U,_vkGetInstanceProcAddr"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-U,_vkGetInstanceProcAddr"]
